name: 更新并发布

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * 1'   # 每周一 09:00（北京时间）
  workflow_dispatch:
    inputs:
      update:
        description: 先拉取新论文并刷新数字
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # 定时运行、手动运行，或者提交信息里带 [update] 时才更新数据；平时推送只重新发布页面。
      - name: 拉取新论文并刷新数字
        if: >-
          github.event_name == 'schedule'
          || (github.event_name == 'workflow_dispatch' && inputs.update)
          || (github.event_name == 'push' && contains(github.event.head_commit.message, '[update]'))
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "数据没有变化"
          else
            git commit --quiet -m "每周更新 $(date -u +%F)"
            git pull --rebase --quiet
            git push --quiet
          fi

      - name: 生成页面数据
        run: python3 scripts/build.py

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      # 刚上传的页面产物偶尔要过几秒才查得到，这时发布会失败：等半分钟再试一次。
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: 发布失败，等一会儿
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: retry
        name: 再发布一次
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
